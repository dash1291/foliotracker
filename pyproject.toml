[project]
name = "foliotracker"
version = "0.1.0"
description = "Net worth and asset allocation tracker fed by Indian CAS statements and manual entries"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "casparser>=1.4.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "kiteconnect>=5.2.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
